name: CI/CD — Test, Build & Push to GHCR

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/mohamed-shaaker/simple-model-api

jobs:
  # ── Job 1: Run test suite ─────────────────────────────────────────────────
  # The build-and-push job only runs when this passes, making tests a hard gate.
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install CPU-only dependencies (avoids the 2 GB CUDA wheel) ────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
                      --extra-index-url https://pypi.org/simple \
                      -r requirements.txt

      # ── 4. Run tests ──────────────────────────────────────────────────────
      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

  # ── Job 2: Build and push Docker image ────────────────────────────────────
  # Only runs after the test job passes — broken code never reaches GHCR.
  build-and-push:
    name: Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    needs: test   # hard dependency: skip build if tests fail

    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. Checkout source code ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Compute the short Git SHA for the image tag ───────────────────
      - name: Set short SHA output
        id: vars
        run: echo "sha_short=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ── 3. Set up Docker Buildx ───────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Log in to GitHub Container Registry ────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Build and push the Docker image ───────────────────────────────
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 6. Print the image digest for traceability ────────────────────────
      - name: Print image digest
        run: |
          echo "Image pushed successfully!"
          echo "   Latest : ${{ env.IMAGE_NAME }}:latest"
          echo "   SHA tag: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}"
