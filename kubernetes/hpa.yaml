###############################################################################
# simple-model-api — Horizontal Pod Autoscaler  (FR-3)
# ─────────────────────────────────────────────────────
# ML-optimised autoscaler for a ResNet-50 FastAPI service running in Minikube.
# Scales the Deployment between 3 and 10 replicas based on both CPU and Memory
# utilisation reported by the Metrics Server.
#
# Why minReplicas = 3?
# ────────────────────
#   ResNet-50 model loading takes several seconds (cold start).  Keeping 3
#   pods warm at all times means at least 2 hot standbys are always ready
#   to absorb traffic while the third may be mid-inference.  This eliminates
#   user-facing latency spikes from cold PyTorch model loads.
#
# How the scaling math works (CPU)
# ────────────────────────────────
#   CPU request per pod     = 250m  (from deployment.yaml)
#   Target average util     = 70%   → target usage = 175m per pod
#
#   Example:  3 pods at 225m each → avg util = 90%
#             Desired = ceil(3 × 90/70) = ceil(3.86) = 4
#
# How the scaling math works (Memory)
# ────────────────────────────────────
#   Memory request per pod  = 512Mi (from deployment.yaml)
#   Target average util     = 80%   → target usage = ~410Mi per pod
#
#   With single-worker Gunicorn, ResNet-50 idles at ~350-400Mi.
#   Under batch inference the resident set grows toward 512Mi.
#   At 80% the HPA adds pods before we approach the 1.5Gi limit,
#   preventing OOM-kills during sustained load.
#
#   The HPA uses the MAX of desired replicas across all metrics, so a
#   memory spike alone (e.g. large batch of images) triggers scale-up
#   even if CPU is idle.
#
# Prerequisites
#   • Metrics Server must be running:  minikube addons enable metrics-server
#   • The Deployment must have cpu AND memory resource requests defined.
#
# Quick-ref configurable values (search & replace):
#   MIN_REPLICAS              →  3
#   MAX_REPLICAS              →  10
#   CPU_TARGET_UTILIZATION    →  70
#   MEMORY_TARGET_UTILIZATION →  80
###############################################################################
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simple-model-api-hpa
  labels:
    app: simple-model-api
spec:
  # ── Target ──────────────────────────────────────────────────────────────────
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simple-model-api-deployment

  # ── Replica Bounds ──────────────────────────────────────────────────────────
  # min 3:  always keep hot standbys to avoid cold-start model loads.
  # max 10: with conservative 250m/512Mi requests, 10 pods require
  #         2500m CPU / 5Gi memory — fits comfortably on a Minikube node
  #         with 4+ cores and 8GB+ RAM, leaving headroom for system pods.
  minReplicas: 3
  maxReplicas: 10

  # ── Scaling Metrics ─────────────────────────────────────────────────────────
  # The HPA evaluates ALL metrics and picks the highest desired replica count.
  metrics:
    # --- CPU ---
    - type: Resource
      resource:
        name: cpu
        target:
          # averageUtilization is a percentage of the cpu *request* (250m).
          # At 70%, the controller targets ~175m average per pod before
          # adding capacity — leaves 30% headroom for inference bursts.
          type: Utilization
          averageUtilization: 70

    # --- Memory ---
    - type: Resource
      resource:
        name: memory
        target:
          # averageUtilization is a percentage of the memory *request* (512Mi).
          # At 80%, the controller targets ~410Mi average per pod.
          # Single-worker ResNet-50 idles at ~350-400Mi; under batch load
          # it climbs toward 512Mi.  This triggers scale-up before pods
          # risk OOM-kill at the 1.5Gi limit.
          type: Utilization
          averageUtilization: 80

  # ── Scaling Behaviour ───────────────────────────────────────────────────────
  # Scale-up:  react immediately to load spikes.  Allow up to 3 new pods
  #            per 60s window — with 10 max replicas we can ramp quickly
  #            under heavy inference load.
  # Scale-down: very conservative — wait 300s (5 min) of sustained low
  #             utilisation, then remove only 1 pod per 180s window.
  #             This guards against premature scale-in between inference
  #             batches and protects the warm model cache in each pod.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0             # react immediately to load
      policies:
        - type: Pods
          value: 3                              # add at most 3 pods per window
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300           # 5-min cooldown before scaling in
      policies:
        - type: Pods
          value: 1                              # remove at most 1 pod per window
          periodSeconds: 180                    # 3-min between successive removals
