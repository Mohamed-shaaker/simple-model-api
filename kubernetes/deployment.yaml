# simple-model-api - Kubernetes Deployment (FR-1 / FR-3)
#
# Key design decisions:
#   replicas: 2         matches HPA minReplicas; fits alongside monitoring stack.
#   RollingUpdate       maxSurge=1, maxUnavailable=0 for zero-downtime.
#   Resource budget     requests 500m/512Mi, limits 2000m/2Gi.
#                       500m CPU prevents CFS throttling during the ~97s model
#                       deserialization at startup. 2-core limit lets the pod
#                       burst for inference while remaining Minikube-friendly.
#   imagePullPolicy     Always - ensures `kubectl rollout restart` fetches the
#                       newest :latest digest from GHCR without a tag change.
#   envFrom ConfigMap   decouples LOG_LEVEL, ENVIRONMENT, etc. from this manifest.
#
# Health probe timing rationale:
#   startupProbe   (failureThreshold: 18 × periodSeconds: 10 = 180s budget):
#                  Gates all other probes. Absorbs the full ResNet-50 cold-start
#                  window (~97s observed) with ~83s of headroom.
#   readinessProbe (initialDelaySeconds: 15): Gives PyTorch sufficient time to
#                  load weights before receiving traffic; only runs after startup passes.
#   livenessProbe  (initialDelaySeconds: 30): Extra buffer before liveness checks
#                  begin; auto-restarts frozen workers after 3 × 15s = 45s.
#
# Quick-ref values:
#   CONTAINER_PORT  8000
#   IMAGE_TAG       ghcr.io/mohamed-shaaker/simple-model-api:latest
#   REPLICAS        2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-model-api-deployment
  labels:
    app: simple-model-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simple-model-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # spin up 1 extra pod before removing old ones
      maxUnavailable: 0  # never take an existing pod offline until replacement is Ready

  template:
    metadata:
      labels:
        app: simple-model-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: simple-model-api
          # CI pushes two tags per commit:
          #   :latest          - always the most recent build of main
          #   :sha-<short-sha> - immutable per-commit tag for rollbacks
          image: ghcr.io/mohamed-shaaker/simple-model-api:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          resources:
            requests:
              cpu: "500m"    # 500m avoids CFS throttling during ~97s model load
              memory: "512Mi"
            limits:
              cpu: "2000m"   # burst for GEMM ops during inference
              memory: "2Gi"  # headroom for concurrent-request transient tensors

          # Three-probe strategy: startupProbe gates readiness and liveness.
          # Kubernetes will not run readiness/liveness checks until startupProbe
          # succeeds at least once, eliminating premature pod termination during
          # the ~97s ResNet-50 weight deserialization window.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5      # give Gunicorn 5s to bind the socket
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 18        # 18 × 10s = 180s startup budget

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          envFrom:
            - configMapRef:
                name: simple-model-api-config

          env:
            - name: PORT
              value: "8000"
            - name: TORCH_HOME
              value: "/opt/torch_cache"

      # 30s matches Gunicorn default graceful timeout - allows in-flight
      # inference requests to complete before SIGKILL.
      terminationGracePeriodSeconds: 30
